name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

  push:
    branches:
      - main
    paths:
      - "terraform/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform

jobs:

  # 1. DETERMINE ENVIRONMENT
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}

    steps:

      - name: Determine target environment
        id: environment
        shell: bash
        run: |

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            ENVIRONMENT="${{ inputs.environment }}"

          else

            # Normal PR / push flow currently targets DEV.
            ENVIRONMENT="dev"

          fi

          echo "Target environment = $ENVIRONMENT"

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"


  # 2. TERRAFORM PLAN
  terraform-plan:
    name: Terraform Plan

    needs:
      - determine-environment

    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}

    steps:

  
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4



      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # Configure AWS OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::821135789828:role/micro-services-github-actions-terraform



      # Terraform Format
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive



      # Terraform Init
      # Backend is selected automatically based on environment.
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="backends/${ENVIRONMENT}.hcl"



      # Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate



      # Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out=tfplan



      # Upload exact Terraform plan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: terraform/tfplan



  # 3. TERRAFORM APPLY
  terraform-apply:
    name: Terraform Apply

    needs:
      - determine-environment
      - terraform-plan

    # Apply only after merge/push to main OR manual dispatch.
    # PR will NEVER apply.

    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
      ||
      github.event_name == 'workflow_dispatch'

    env:
      ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}

    # GitHub Environment protection
    # dev/test/stage environments can have their own
    # approval rules.

    environment:
      name: ${{ needs.determine-environment.outputs.environment }}

    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4



      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3



      # Configure AWS OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::821135789828:role/micro-services-github-actions-terraform


      # Initialize Terraform using environment backend
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="backends/${ENVIRONMENT}.hcl"


      # Download exact plan generated by PLAN job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: terraform


      # Apply exact reviewed plan
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            tfplan