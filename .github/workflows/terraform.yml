name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

  push:
    branches:
      - main
    paths:
      - "terraform/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform

jobs:


    # 1. DETECT AFFECTED ENVIRONMENTS
  detect-changes:
    name: Detect Changed Environments
    runs-on: ubuntu-latest

    outputs:
      dev: ${{ steps.detect.outputs.dev }}
      test: ${{ steps.detect.outputs.test }}
      stage: ${{ steps.detect.outputs.stage }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Terraform files
        id: detect
        shell: bash
        run: |

          echo "======================================"
          echo "Terraform Change Detection"
          echo "======================================"

          DEV=false
          TEST=false
          STAGE=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          echo "BASE_SHA = $BASE_SHA"
          echo "HEAD_SHA = $HEAD_SHA"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo ""
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          while IFS= read -r file; do

            [[ -z "$file" ]] && continue

            echo "Checking: $file"

            # Environment-specific changes

            if [[ "$file" == "terraform/environments/dev.tfvars" ]]; then
              DEV=true
            fi

            if [[ "$file" == "terraform/environments/test.tfvars" ]]; then
              TEST=true
            fi

            if [[ "$file" == "terraform/environments/stage.tfvars" ]]; then
              STAGE=true
            fi


            # Shared Terraform changes
            if [[ "$file" == terraform/modules/* ]] ||
               [[ "$file" == "terraform/main.tf" ]] ||
               [[ "$file" == "terraform/variables.tf" ]] ||
               [[ "$file" == "terraform/providers.tf" ]] ||
               [[ "$file" == "terraform/versions.tf" ]] ||
               [[ "$file" == "terraform/backend.tf" ]] ||
               [[ "$file" == "terraform/locals.tf" ]] ||
               [[ "$file" == "terraform/outputs.tf" ]]; then

              echo "Shared Terraform change detected."

              DEV=true
              TEST=true
              STAGE=true

            fi

          done <<< "$CHANGED_FILES"


          echo ""
          echo "======================================"
          echo "Affected environments"
          echo "======================================"

          echo "DEV   = $DEV"
          echo "TEST  = $TEST"
          echo "STAGE = $STAGE"

          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

  # 2. DETERMINE ENVIRONMENT
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}

    steps:

      - name: Determine target environment
        id: environment
        shell: bash
        run: |

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            ENVIRONMENT="${{ inputs.environment }}"

          else

            # Normal PR / push flow currently targets DEV.
            ENVIRONMENT="dev"

          fi

          echo "Target environment = $ENVIRONMENT"

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"


  # 3. TERRAFORM PLAN
  terraform-plan:
    name: Terraform Plan

    needs:
      - determine-environment

    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}

    steps:

  
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4



      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug GitHub Context
        run: |
          echo "Repository = ${{ github.repository }}"
          echo "Ref = ${{ github.ref }}"
          echo "Ref Name = ${{ github.ref_name }}"
          echo "Event = ${{ github.event_name }}"


      - name: Print OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
              const token = await core.getIDToken('sts.amazonaws.com');

              const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
              );

                console.log(JSON.stringify(payload, null, 2));


      # Configure AWS OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::821135789828:role/micro-services-github-actions-terraform



      # Terraform Format
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive



      # Terraform Init
      # Backend is selected automatically based on environment.
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="backends/${ENVIRONMENT}.hcl"



      # Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate



      # Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out=tfplan



      # Upload exact Terraform plan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: terraform/tfplan



  # 4. TERRAFORM APPLY
  terraform-apply:
    name: Terraform Apply

    needs:
      - determine-environment
      - terraform-plan

    # Apply only after merge/push to main OR manual dispatch.
    # PR will NEVER apply.

    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
      ||
      github.event_name == 'workflow_dispatch'

    env:
      ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}

    # GitHub Environment protection
    # dev/test/stage environments can have their own
    # approval rules.

    environment:
      name: ${{ needs.determine-environment.outputs.environment }}

    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4



      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Debug GitHub Context
        run: |
          echo "Repository = ${{ github.repository }}"
          echo "Ref = ${{ github.ref }}"
          echo "Ref Name = ${{ github.ref_name }}"
          echo "Event = ${{ github.event_name }}"


      - name: Print OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
              const token = await core.getIDToken('sts.amazonaws.com');

              const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
              );

                console.log(JSON.stringify(payload, null, 2));



      # Configure AWS OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::821135789828:role/micro-services-github-actions-terraform


      # Initialize Terraform using environment backend
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="backends/${ENVIRONMENT}.hcl"


      # Download exact plan generated by PLAN job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: terraform


      # Apply exact reviewed plan
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            tfplan