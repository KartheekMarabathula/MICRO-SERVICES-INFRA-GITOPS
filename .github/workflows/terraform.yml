name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

  push:
    branches:
      - main
    paths:
      - "terraform/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform

jobs:


    # 1. DETECT AFFECTED ENVIRONMENTS
  detect-changes:
    name: Detect Changed Environments
    runs-on: ubuntu-latest

    outputs:
      dev: ${{ steps.detect.outputs.dev }}
      test: ${{ steps.detect.outputs.test }}
      stage: ${{ steps.detect.outputs.stage }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Terraform files
        id: detect
        shell: bash
        run: |

          echo "======================================"
          echo "Terraform Change Detection"
          echo "======================================"

          DEV=false
          TEST=false
          STAGE=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          echo "BASE_SHA = $BASE_SHA"
          echo "HEAD_SHA = $HEAD_SHA"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo ""
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          while IFS= read -r file; do

            [[ -z "$file" ]] && continue

            echo "Checking: $file"

            # Environment-specific changes

            if [[ "$file" == "terraform/environments/dev.tfvars" ]]; then
              DEV=true
            fi

            if [[ "$file" == "terraform/environments/test.tfvars" ]]; then
              TEST=true
            fi

            if [[ "$file" == "terraform/environments/stage.tfvars" ]]; then
              STAGE=true
            fi


            # Shared Terraform changes
            if [[ "$file" == terraform/modules/* ]] ||
               [[ "$file" == "terraform/main.tf" ]] ||
               [[ "$file" == "terraform/variables.tf" ]] ||
               [[ "$file" == "terraform/providers.tf" ]] ||
               [[ "$file" == "terraform/versions.tf" ]] ||
               [[ "$file" == "terraform/backend.tf" ]] ||
               [[ "$file" == "terraform/locals.tf" ]] ||
               [[ "$file" == "terraform/outputs.tf" ]]; then

              echo "Shared Terraform change detected."

              DEV=true
              TEST=true
              STAGE=true

            fi

          done <<< "$CHANGED_FILES"


          echo ""
          echo "======================================"
          echo "Affected environments"
          echo "======================================"

          echo "DEV   = $DEV"
          echo "TEST  = $TEST"
          echo "STAGE = $STAGE"

          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"


  # 2. BUILD-APPLY-MATRIX job
  build-apply-matrix:
    name: Build Apply Matrix
    runs-on: ubuntu-latest

    needs:
      - detect-changes

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

    - name: Build affected environment matrix
      id: matrix
      shell: bash
      run: |

        echo "======================================"
        echo "Building Terraform Apply Matrix"
        echo "======================================"

        ENVIRONMENTS=()

        if [[ "${{ needs.detect-changes.outputs.dev }}" == "true" ]]; then
          ENVIRONMENTS+=('"dev"')
        fi

        if [[ "${{ needs.detect-changes.outputs.test }}" == "true" ]]; then
          ENVIRONMENTS+=('"test"')
        fi

        if [[ "${{ needs.detect-changes.outputs.stage }}" == "true" ]]; then
          ENVIRONMENTS+=('"stage"')
        fi

        if [[ ${#ENVIRONMENTS[@]} -eq 0 ]]; then

          MATRIX='{"environment":[]}'

        else

          MATRIX='{"environment":['
          MATRIX+=$(IFS=,; echo "${ENVIRONMENTS[*]}")
          MATRIX+=']}'

        fi

        echo ""
        echo "Generated Apply Matrix:"
        echo "$MATRIX"
        echo ""

        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"        


  # 3. DETERMINE ENVIRONMENT
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}

    steps:

      - name: Determine target environment
        id: environment
        shell: bash
        run: |

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            ENVIRONMENT="${{ inputs.environment }}"

          else

            # Normal PR / push flow currently targets DEV.
            ENVIRONMENT="dev"

          fi

          echo "Target environment = $ENVIRONMENT"

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"


    # 4. TERRAFORM PLAN
  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})

    needs:
      - detect-changes

    if: |
      needs.detect-changes.outputs.dev == 'true' ||
      needs.detect-changes.outputs.test == 'true' ||
      needs.detect-changes.outputs.stage == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - test
          - stage

    env:
      ENVIRONMENT: ${{ matrix.environment }}

    steps:

      - name: Check if environment is affected
        id: check
        shell: bash
        run: |

          case "${ENVIRONMENT}" in

            dev)
              AFFECTED="${{ needs.detect-changes.outputs.dev }}"
              ;;

            test)
              AFFECTED="${{ needs.detect-changes.outputs.test }}"
              ;;

            stage)
              AFFECTED="${{ needs.detect-changes.outputs.stage }}"
              ;;

          esac

          echo "Environment = ${ENVIRONMENT}"
          echo "Affected = ${AFFECTED}"

          if [[ "$AFFECTED" != "true" ]]; then
            echo "Environment ${ENVIRONMENT} is not affected."
            echo "Skipping Terraform plan."

            echo "run_plan=false" >> "$GITHUB_OUTPUT"
          else
            echo "Environment ${ENVIRONMENT} is affected."
            echo "Terraform plan will run."

            echo "run_plan=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Checkout repository
        if: steps.check.outputs.run_plan == 'true'
        uses: actions/checkout@v4


      - name: Setup Terraform
        if: steps.check.outputs.run_plan == 'true'
        uses: hashicorp/setup-terraform@v3


      - name: Debug GitHub Context
        if: steps.check.outputs.run_plan == 'true'
        run: |
          echo "Repository = ${{ github.repository }}"
          echo "Ref = ${{ github.ref }}"
          echo "Ref Name = ${{ github.ref_name }}"
          echo "Event = ${{ github.event_name }}"
          echo "Environment = $ENVIRONMENT"


      - name: Configure AWS credentials
        if: steps.check.outputs.run_plan == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::821135789828:role/micro-services-github-actions-terraform


      - name: Terraform Format Check
        if: steps.check.outputs.run_plan == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      - name: Terraform Init
        if: steps.check.outputs.run_plan == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="backends/${ENVIRONMENT}.hcl"


      - name: Terraform Validate
        if: steps.check.outputs.run_plan == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      - name: Terraform Plan
        if: steps.check.outputs.run_plan == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out=tfplan


      - name: Upload Terraform Plan
        if: steps.check.outputs.run_plan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: terraform/tfplan



    # 5. TERRAFORM APPLY
  terraform-apply:
    name: Terraform Apply (${{ matrix.environment }})

    needs:
      - detect-changes
      - terraform-plan
      - build-apply-matrix

    if: |
      (
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
      )
      ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-apply-matrix.outputs.matrix) }}

    env:
      ENVIRONMENT: ${{ matrix.environment }}

    environment:
      name: ${{ matrix.environment }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Debug GitHub Context
      run: |
        echo "Repository  = ${{ github.repository }}"
        echo "Ref         = ${{ github.ref }}"
        echo "Ref Name    = ${{ github.ref_name }}"
        echo "Event       = ${{ github.event_name }}"
        echo "Environment = $ENVIRONMENT"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: arn:aws:iam::821135789828:role/micro-services-github-actions-terraform

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -input=false \
          -backend-config="backends/${ENVIRONMENT}.hcl"

    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-${{ env.ENVIRONMENT }}
        path: terraform

    - name: Terraform Apply
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform apply \
          -input=false \
          tfplan